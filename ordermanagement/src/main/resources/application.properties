spring.application.name=orderManagement

spring.mvc.view.prefix=/views/
spring.mvc.view.suffix=.jsp

spring.datasource.url=jdbc:mysql://localhost:3307/restaurant
spring.datasource.username=restaurant
spring.datasource.password=restaurant

spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.security.filter.dispatcher-types=request,async